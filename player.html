/* Disable text selection and user interactions */

  -webkit-user-select: none;

  -ms-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

/* Disable context menu on images and video */
img, video {
  pointer-events: auto;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-user-drag: none;
}

/* Allow text selection only in specific areas if needed */

    header {
      display: flex;

footer {

/* Hide footer in fullscreen by default */

  <script>
    let player;
    let currentScale = 'crop';
    let controlsTimeout;
    let isControlsVisible = false;
	let preferredLang = null;
	let currentEPGOffset = 0;  
	let currentChannelEPG = null;

const languageMap = {
  'tam': 'Tamil', 'ta': 'Tamil',
  'tel': 'Telugu', 'te': 'Telugu',
  'mal': 'Malayalam', 'ml': 'Malayalam',
  'kan': 'Kannada', 'kn': 'Kannada',
  'hin': 'Hindi', 'hi': 'Hindi',
  'ben': 'Bengali', 'bn': 'Bengali',
  'guj': 'Gujarati', 'gu': 'Gujarati',
  'ori': 'Odia', 'or': 'Odia',
  'mar': 'Marathi', 'mr': 'Marathi',
  'eng': 'English', 'en': 'English',
  'pan': 'Punjabi', 'pa': 'Punjabi',
  'und': 'Unknown'
};

function getLanguageName(code) {
  if (!code) return 'Unknown';
  const normalized = code.toLowerCase().substring(0, 3);
  const twoLetter = code.toLowerCase().substring(0, 2);
  return languageMap[normalized] || languageMap[twoLetter] || code || 'Unknown';
}

function getLanguageCode(languageName) {
  if (!languageName) return null;
  const nameLower = languageName.toLowerCase();
  
  // Find the code that maps to this language name
  for (const [code, name] of Object.entries(languageMap)) {
    if (name.toLowerCase() === nameLower) {
      return code;
    }
  }
  return null;
}
	
function positionDropdown(button, menu) {
  const buttonRect = button.getBoundingClientRect();
  const menuHeight = menu.offsetHeight || 300; // estimated height
  const viewportHeight = window.innerHeight;
  const viewportWidth = window.innerWidth;
  
  // Calculate available space above and below
  const spaceAbove = buttonRect.top;
  const spaceBelow = viewportHeight - buttonRect.bottom;
  
  // Position horizontally (centered on button)
  let left = buttonRect.left + (buttonRect.width / 2) - (menu.offsetWidth / 2);
  
  // Keep within viewport horizontally
  if (left < 10) left = 10;
  if (left + menu.offsetWidth > viewportWidth - 10) {
    left = viewportWidth - menu.offsetWidth - 10;
  }
  
  menu.style.left = left + 'px';
  
  // Position vertically (prefer above button)
  if (spaceAbove > menuHeight + 10 || spaceAbove > spaceBelow) {
    // Show above button
    menu.style.bottom = (viewportHeight - buttonRect.top + 8) + 'px';
    menu.style.top = 'auto';
  } else {
    // Show below button
    menu.style.top = (buttonRect.bottom + 8) + 'px';
    menu.style.bottom = 'auto';
  }
}

      header.classList.remove('hidden');
      video.className = 'fit';

});

function replaceDomainIfNeeded(originalUrl, cookieLinkDomain) {
  if (!cookieLinkDomain) return originalUrl;
  
  try {
    const originalUrlObj = new URL(originalUrl);
    const cookieDomainObj = new URL(cookieLinkDomain);
    
    // IMPORTANT: Only replace if the original URL is a Jio CDN domain
    const isJioCDN = originalUrlObj.hostname.includes('cdn.jio.com');
    
    if (!isJioCDN) {
      console.log('Not a Jio CDN link, skipping domain replacement');
      return originalUrl; // Don't touch non-Jio links
    }
    
    // Compare base domains (protocol + hostname)
    if (originalUrlObj.origin !== cookieDomainObj.origin) {
      // Replace the domain but keep the path
      console.log(`Replacing domain: ${originalUrlObj.origin} → ${cookieDomainObj.origin}`);
      return cookieLinkDomain + originalUrlObj.pathname + originalUrlObj.search;
    }
  } catch (err) {
    console.warn('Error comparing domains:', err);
  }
  
  return originalUrl;
}

function isCookieValid(cookieString) {
  try {
    const expMatch = cookieString.match(/exp=(\d+)/);
    if (!expMatch) return false;
    
    const expiryTime = parseInt(expMatch[1]) * 1000;
    const currentTime = Date.now();
    
    return currentTime < expiryTime;
  } catch (err) {
    console.warn('Error parsing cookie:', err);
    return false;
  }
}

function setupEPGScrollButtons() {
  const scrollLeftBtn = document.getElementById('scrollLeftBtn');
  const scrollRightBtn = document.getElementById('scrollRightBtn');
  const epgTimeline = document.getElementById('epgTimeline');
  
  if (!scrollLeftBtn || !scrollRightBtn || !epgTimeline) return;
  
  scrollLeftBtn.addEventListener('click', () => {
    epgTimeline.scrollBy({
      left: -300,
      behavior: 'smooth'
    });
  });
  
  scrollRightBtn.addEventListener('click', () => {
    epgTimeline.scrollBy({
      left: 300,
      behavior: 'smooth'
    });
  });
}

function setupDateNavigation() {
  const dropdown = document.getElementById('epgDateDropdown');
  
  if (!dropdown) return;
  
  // Populate dropdown with dates
  function populateDropdown() {
    dropdown.innerHTML = '';
    
    const today = new Date();
    
    // Add past 7 days
    for (let i = -7; i <= 6; i++) {
      const date = new Date(today);
      date.setDate(today.getDate() + i);
      
      const option = document.createElement('option');
      option.value = i;
      
      // Format date
      const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
      const monthDay = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      
      if (i === 0) {
        option.textContent = `Today (${dayName}, ${monthDay})`;
      } else if (i === -1) {
        option.textContent = `Yesterday (${dayName}, ${monthDay})`;
      } else if (i === 1) {
        option.textContent = `Tomorrow (${dayName}, ${monthDay})`;
      } else if (i < 0) {
        option.textContent = `${Math.abs(i)} days ago (${dayName}, ${monthDay})`;
      } else {
        option.textContent = `In ${i} days (${dayName}, ${monthDay})`;
      }
      
      dropdown.appendChild(option);
    }
    
    // Set current selection
    dropdown.value = currentEPGOffset;
  }
  
  // Handle dropdown change
  dropdown.addEventListener('change', async (e) => {
    const newOffset = parseInt(e.target.value);
    if (!isNaN(newOffset) && currentChannelEPG) {
      currentEPGOffset = newOffset;
      await loadEPG(currentChannelEPG, currentEPGOffset);
    }
  });
  
  populateDropdown();
}	
	
// EPG Functions
async function loadEPG(epgUrl, offset = 0) {
  const epgTimeline = document.getElementById('epgTimeline');
  
  // Store the base EPG URL for date navigation
  if (!currentChannelEPG) {
    currentChannelEPG = epgUrl;
  }
  
  // Show loading state
  epgTimeline.innerHTML = '<div class="epg-loading">Loading programs...</div>';
  
  try {
    // Modify URL to include offset
    let modifiedUrl = epgUrl;
    
    // Replace existing offset parameter or add new one
    if (modifiedUrl.includes('offset=')) {
      modifiedUrl = modifiedUrl.replace(/offset=-?\d+/, `offset=${offset}`);
    } else {
      const separator = modifiedUrl.includes('?') ? '&' : '?';
      modifiedUrl += `${separator}offset=${offset}`;
    }
    
    // Force bypass cache with timestamp
    const separator = modifiedUrl.includes('?') ? '&' : '?';
    const cacheBustedUrl = `${modifiedUrl}${separator}_t=${Date.now()}`;
    
    const response = await fetch(cacheBustedUrl, {
      cache: 'no-store',
      headers: {
        'Cache-Control': 'no-cache'
      }
    });
    const data = await response.json();
    
    if (data.epg && data.epg.length > 0) {
      renderEPG(data.epg);
      
      // Update dropdown to reflect current offset
      const dropdown = document.getElementById('epgDateDropdown');
      if (dropdown) {
        dropdown.value = offset;
      }
    } else {
      epgTimeline.innerHTML = '<div class="epg-loading">No program data available</div>';
    }
  } catch (error) {
    console.error('Error loading EPG:', error);
    epgTimeline.innerHTML = '<div class="epg-loading">Failed to load program guide</div>';
  }
}

function renderEPG(programs) {
  const epgTimeline = document.getElementById('epgTimeline');
  const now = Date.now();
  
  epgTimeline.innerHTML = '';
  
  // NEW: Find current program index BEFORE rendering
  let currentIndex = programs.findIndex(program => {
    return now >= program.startEpoch && now <= program.endEpoch;
  });
  
  // If no current program found, find the next upcoming one
  if (currentIndex === -1) {
    currentIndex = programs.findIndex(program => program.startEpoch > now);
  }
  
  // If still not found, default to first program
  if (currentIndex === -1) {
    currentIndex = 0;
  }
  
  // CHANGED: Added index parameter to forEach
  programs.forEach((program, index) => {
    const startTime = program.startEpoch;
    const endTime = program.endEpoch;
    const isCurrent = now >= startTime && now <= endTime;
    
    const programCard = document.createElement('div');
    programCard.className = `epg-program ${isCurrent ? 'current' : ''}`;
    
    const posterUrl = program.episodePoster 
      ? `https://jiotvimages.cdn.jio.com/dare_images/shows/${program.episodePoster}`
      : 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 140\'%3E%3Crect fill=\'%231f2833\' width=\'100\' height=\'140\'/%3E%3Ctext x=\'50\' y=\'70\' font-family=\'Arial\' font-size=\'30\' fill=\'%2366fcf1\' text-anchor=\'middle\' dominant-baseline=\'middle\'%3ETV%3C/text%3E%3C/svg%3E';
    
    // CHANGED: Added live badge inside HTML
    programCard.innerHTML = `
      <div class="epg-poster">
        ${isCurrent ? '<div class="epg-live-badge">▶ LIVE NOW</div>' : ''}
        <img src="${posterUrl}" alt="${program.showname}" loading="lazy">
      </div>
      <div class="epg-info">
        <div class="epg-time">${program.showtime} - ${program.endtime}</div>
        <div class="epg-title">${program.showname}</div>
      </div>
    `;
    
    programCard.addEventListener('click', () => showEPGDetails(program));
    
    epgTimeline.appendChild(programCard);
  });
  
  // CHANGED: Scroll to current program immediately (no animation)
  const currentCard = epgTimeline.children[currentIndex];
  if (currentCard) {
    currentCard.scrollIntoView({ behavior: 'auto', block: 'nearest', inline: 'center' });
  }
}

function showEPGDetails(program) {
  // Create modal if doesn't exist
  let modal = document.getElementById('epgModal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'epgModal';
    modal.className = 'epg-modal';
    document.body.appendChild(modal);
    
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('show');
      }
    });
  }
  
  const posterUrl = program.episodePoster 
    ? `https://jiotvimages.cdn.jio.com/dare_images/shows/${program.episodePoster}`
    : '';
  
  const genres = Array.isArray(program.showGenre) ? program.showGenre.join(', ') : program.showGenre || 'N/A';
  
  modal.innerHTML = `
    <div class="epg-modal-content">
      <button class="epg-modal-close" onclick="document.getElementById('epgModal').classList.remove('show')">×</button>
      ${posterUrl ? `<img src="${posterUrl}" alt="${program.showname}" class="epg-modal-poster">` : ''}
      <div class="epg-modal-body">
        <h2 class="epg-modal-title">${program.showname}</h2>
        <div class="epg-modal-meta">
          <span>⏰ ${program.showtime} - ${program.endtime}</span>
          <span>⏱️ ${program.duration} mins</span>
          <span>📺 ${program.showCategory || 'Program'}</span>
        </div>
        ${program.description ? `<p class="epg-modal-description">${program.description}</p>` : ''}
        ${program.director ? `<div class="epg-modal-detail"><strong>Director:</strong> ${program.director}</div>` : ''}
        ${program.starCast ? `<div class="epg-modal-detail"><strong>Cast:</strong> ${program.starCast}</div>` : ''}
        <div class="epg-modal-detail"><strong>Genre:</strong> ${genres}</div>
        ${program.pcr ? `<div class="epg-modal-detail"><strong>Rating:</strong> ${program.pcr}</div>` : ''}
      </div>
    </div>
  `;
  
  modal.classList.add('show');
}	

// Disable context menu (right-click) everywhere
document.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  return false;
});

// Disable long press context menu on touch devices
document.addEventListener('touchstart', (e) => {
  if (e.touches.length > 1) {
    e.preventDefault();
  }
}, { passive: false });

document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (window.lastTouchEnd && (now - window.lastTouchEnd) < 300) {
    e.preventDefault();
  }
  window.lastTouchEnd = now;
}, { passive: false });

// Disable text selection on drag
document.addEventListener('selectstart', (e) => {
  // Allow selection only in input/textarea elements
  if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
    e.preventDefault();
  }
});

// Disable copy/paste operations
document.addEventListener('copy', (e) => {
  e.preventDefault();
  return false;
});

document.addEventListener('cut', (e) => {
  e.preventDefault();
  return false;
});

document.addEventListener('paste', (e) => {
