<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Channel Details | Pangu Catchup</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <style>
    body {
      background: radial-gradient(circle at top, #1f2937 0, #020617 55%);
      color: #e5e7eb;
      min-height: 100vh;
    }
    .glass {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.25);
    }
    .gradient-text {
      background: linear-gradient(90deg, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card-hover {
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .card-hover:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.95);
      border-color: rgba(168, 85, 247, 0.7);
    }
    @media (max-width: 640px) {
      .logo-img {
        width: 80px !important;
        height: 80px !important;
      }
    }
  </style>
</head>
<body>
  <header class="border-b border-slate-800/70 bg-slate-950/80 backdrop-blur sticky top-0 z-20">
    <div class="max-w-4xl mx-auto px-3 py-2.5 flex items-center justify-between">
      <a href="catchupindex.html" class="text-xs text-slate-400 hover:text-slate-200 flex items-center gap-1.5">
        <span class="text-base">←</span>
        <span>Channels</span>
      </a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-3 py-4 md:py-6">
    <section id="infoCard" class="glass rounded-xl border border-slate-800 p-4 md:p-6 mb-4 md:mb-6">
      <div class="flex flex-col md:flex-row gap-4 md:gap-6 items-center md:items-start">
        <img id="logo" src="" alt="" class="logo-img w-20 h-20 md:w-24 md:h-24 rounded-xl bg-slate-900 border border-slate-800 object-contain" />
        <div class="flex-1 w-full text-center md:text-left">
          <h1 id="name" class="text-lg md:text-2xl font-bold gradient-text mb-1">Loading…</h1>
          <p id="idLine" class="text-xs text-slate-400 mb-3"></p>

          <div class="flex flex-col sm:flex-row flex-wrap gap-2 justify-center md:justify-start">
            <button
              id="liveBtn"
              class="hidden px-4 py-2 rounded-full text-sm font-medium bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white inline-flex items-center justify-center gap-1.5"
            >
              <span>▶</span>
              <span>Watch Live</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <section>
      <h2 class="text-sm font-semibold text-slate-200 mb-3 px-1">Available Catchup Dates</h2>
      <div id="status" class="text-xs text-slate-400 mb-3 px-1">Loading…</div>
      <div id="datesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>
    </section>
  </main>

  <script>
    const WORKER_BASE = "https://catchup.porus-in2012.workers.dev";

    function getQueryParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function extractHexFromWorkerUrl(url, type) {
      if (!url) return null;
      const m = url.match(new RegExp("/" + type + "/([^/?#]+)"));
      return m ? m[1] : null;
    }
	
async function decryptWorkerResponse(encryptedB64) {
  const ENCRYPTION_KEY = "PUSHPA1210SUBBU1501PURUSHOTH1005"; // SAME KEY as worker
  
  try {
    // Decode base64
    const combined = Uint8Array.from(atob(encryptedB64), c => c.charCodeAt(0));
    
    // Extract IV and encrypted data
    const iv = combined.slice(0, 12);
    const encrypted = combined.slice(12);
    
    // Import key
    const key = await crypto.subtle.importKey(
      "raw",
      new TextEncoder().encode(ENCRYPTION_KEY),
      { name: "AES-GCM" },
      false,
      ["decrypt"]
    );
    
    // Decrypt
    const decrypted = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: iv },
      key,
      encrypted
    );
    
    const plaintext = new TextDecoder().decode(decrypted);
    return JSON.parse(plaintext);
  } catch (err) {
    throw new Error("Decryption failed: " + err.message);
  }
}	

    async function loadDetails() {
      const hex = getQueryParam("hex");
      const id = getQueryParam("id");
      const statusEl = document.getElementById("status");
      const datesGrid = document.getElementById("datesGrid");

      if (!hex) {
        statusEl.textContent = "Missing hex parameter";
        statusEl.classList.add("text-red-400");
        return;
      }

      try {
		const res = await fetch(`${WORKER_BASE}/details/${hex}/`);
		if (!res.ok) throw new Error("HTTP " + res.status);
		const encryptedResponse = await res.json();
		const data = await decryptWorkerResponse(encryptedResponse.encrypted);

        document.getElementById("logo").src = data.logo || "";
        document.getElementById("logo").alt = data.name || "";
        document.getElementById("name").textContent = data.name || "Unknown Channel";
        document.getElementById("idLine").textContent = `Channel ID: ${data.id || id || "N/A"}`;

        // Live button
        const liveHex = extractHexFromWorkerUrl(data.live_url, "play");
        const liveBtn = document.getElementById("liveBtn");
        if (liveHex) {
          liveBtn.classList.remove("hidden");
          liveBtn.addEventListener("click", () => {
            window.location.href = `cplayer.html?mode=live&hex=${encodeURIComponent(liveHex)}`;
          });
        }

        const catchupArr = Array.isArray(data.catchup) ? data.catchup : [];
        if (catchupArr.length === 0) {
          statusEl.textContent = "No catchup dates available";
          return;
        }

        statusEl.textContent = `${catchupArr.length} day${catchupArr.length !== 1 ? 's' : ''} available`;

        catchupArr.forEach((item) => {
          const cpHex = extractHexFromWorkerUrl(item.catchup_url, "cp");
          const card = document.createElement("div");
          card.className = "glass card-hover rounded-xl border border-slate-800 p-3 text-center flex flex-col justify-between";
          card.innerHTML = `
            <div class="mb-2.5">
              <div class="text-2xl md:text-3xl font-bold text-purple-400">${item.day_number}</div>
              <div class="text-xs text-slate-400 mt-1">${item.day_name}</div>
              <div class="text-[10px] text-slate-500 mt-0.5">${item.month_year}</div>
            </div>
            ${
              cpHex
                ? `<a href="catchup.html?hex=${encodeURIComponent(cpHex)}"
                     class="inline-block text-[10px] font-medium px-3 py-1.5 rounded-full
                            bg-slate-900/80 border border-purple-600/70 text-slate-100 hover:bg-slate-800/80">
                      View Programs
                   </a>`
                : `<span class="text-[10px] text-red-400">Invalid link</span>`
            }
          `;
          datesGrid.appendChild(card);
        });
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Failed to load details";
        statusEl.classList.add("text-red-400");
      }
    }

    loadDetails();
  </script>
</body>
</html>
