<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <title>Live TV Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.plyr.io/3.6.2/plyr.css" />
  <script src="https://cdn.plyr.io/3.6.3/plyr.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    body {
      background: #0b0c10;
      color: #fff;
      font-family: "Poppins", sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      background: rgba(31, 40, 51, 0.95);
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.4);
      z-index: 2000;
      flex-shrink: 0;
	  min-height: 60px; 
	  height: auto;
    }

    header.hidden {
      transform: translateY(-100%);
      transition: transform 0.3s;
    }

    header img {
      height: 45px;
      width: 45px;
      object-fit: contain;
      border-radius: 8px;
      margin-right: 15px;
      background: rgba(0,0,0,0.3);
      padding: 4px;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      flex: 1;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    header button {
      background: linear-gradient(135deg, #45a29e 0%, #66fcf1 100%);
      border: none;
      color: #0b0c10;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      font-size: 0.9rem;
    }

    header button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 252, 241, 0.4);
    }
	
.header-audio-btn {
  background: rgba(69, 162, 158, 0.9);
  border: 1px solid #66fcf1;
  color: #fff;
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  font-size: 1.1rem;
  margin-right: 10px;
  display: none; /* Hidden until tracks are available */
  position: relative;
}

.header-audio-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(102, 252, 241, 0.4);
}

.header-audio-dropdown {
  display: none;
  position: fixed;
  background: rgba(31, 40, 51, 0.98);
  border: 1px solid #45a29e;
  border-radius: 8px;
  padding: 8px;
  max-height: 300px;
  overflow-y: auto;
  min-width: 180px;
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  z-index: 3000;
}

.header-audio-dropdown.show {
  display: block;
}

.header-audio-dropdown-item {
  padding: 12px 16px;
  cursor: pointer;
  border-radius: 5px;
  transition: all 0.2s;
  font-size: 0.9rem;
  color: #ccc;
  font-family: "Poppins", sans-serif;
  white-space: nowrap;
}

.header-audio-dropdown-item:hover {
  background: rgba(69, 162, 158, 0.4);
  color: #66fcf1;
}

.header-audio-dropdown-item.active {
  background: rgba(102, 252, 241, 0.3);
  color: #66fcf1;
  font-weight: 600;
}	

    .player-wrapper {
      flex: 0 0 auto;
	  height: 40vh; 
	  max-height: 40vh;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      width: 100%;
      min-height: 0;
    }

    .plyr {
      width: 100%;
      height: 100%;
    }

    .plyr__video-wrapper {
      height: 100%;
    }

    video {
      width: 100%;
      height: 100%;
      background: #000;
      outline: none;
	  object-fit: contain;
    }
	
	body.in-fullscreen video {
	  object-fit: fill;
	}

    .error-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #ff6b6b;
      font-size: 1.1rem;
      padding: 20px;
      background: rgba(31, 40, 51, 0.9);
      border-radius: 12px;
      border: 2px solid #ff6b6b;
      max-width: 80%;
      z-index: 10;
      display: none;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      background: rgba(31, 40, 51, 0.95);
      backdrop-filter: blur(10px);
      box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.4);
      z-index: 2000;
      flex-shrink: 0;
	  min-height: 50px; 
	  height: auto;
      transition: none;
    }

    body:not(.in-fullscreen) footer {
      display: flex !important;
      opacity: 1;
      visibility: visible;
    }

    body.in-fullscreen footer {
      display: none;
      opacity: 0;
      visibility: hidden;
    }

    body.in-fullscreen footer.visible {
      display: flex !important;
      opacity: 1;
      visibility: visible;
    }

    .epg-section {
      flex: 1 1 auto;
      background: linear-gradient(180deg, #0b0c10 0%, #1a1d29 100%);
      overflow: hidden;
      padding: 0 15px 15px 15px;
      min-height: 0;
	  max-height: calc(60vh - 120px);
      display: flex;
      flex-direction: column;
    }

    .epg-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(180deg, #0b0c10 0%, #1a1d29 100%);
      margin-bottom: 15px;
      padding: 15px 0 10px 0;
      border-bottom: 2px solid #45a29e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .epg-header h3 {
      margin: 0;
      font-size: 1.2rem;
      color: #66fcf1;
      font-weight: 600;
      flex-shrink: 0;
    }

    .epg-date-controls {
      display: flex;
      align-items: center;
    }

    .epg-date-dropdown {
      background: rgba(69, 162, 158, 0.9);
      border: 1px solid #66fcf1;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.3s;
      white-space: nowrap;
      user-select: none;
      outline: none;
      min-width: 150px;
      font-family: "Poppins", sans-serif;
    }

    .epg-date-dropdown:hover {
      background: #66fcf1;
      color: #0b0c10;
    }

    .epg-date-dropdown:focus {
      border-color: #66fcf1;
      box-shadow: 0 0 10px rgba(102, 252, 241, 0.3);
    }

    .epg-date-dropdown option {
      background: #1f2833;
      color: #fff;
      padding: 8px;
    }

    .epg-scroll-container {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
    }

    .epg-timeline {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      overflow-y: auto;
      padding-bottom: 10px;
      scroll-snap-type: x proximity;
      flex: 1;
      min-height: 0;
    }

    .epg-scroll-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(69, 162, 158, 0.9);
      border: 2px solid #66fcf1;
      color: #fff;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.5rem;
      font-weight: bold;
      transition: all 0.3s;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      user-select: none;
    }

    .epg-scroll-btn:hover {
      background: #66fcf1;
      color: #0b0c10;
      transform: translateY(-50%) scale(1.1);
    }

    .epg-scroll-btn:active {
      transform: translateY(-50%) scale(0.95);
    }

    .epg-scroll-btn.left {
      left: 10px;
    }

    .epg-scroll-btn.right {
      right: 10px;
    }

    @media (min-width: 1024px) {
      .epg-scroll-btn {
        display: flex;
      }
    }

    .epg-loading {
      text-align: center;
      color: rgba(255,255,255,0.6);
      padding: 40px 20px;
      width: 100%;
    }

    .epg-program {
      min-width: 200px;
      max-width: 200px;
      background: linear-gradient(145deg, #1f2833 0%, #2a3441 100%);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid transparent;
      scroll-snap-align: start;
    }

    .epg-program:hover {
      border-color: #45a29e;
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(102, 252, 241, 0.2);
    }

    .epg-program.current {
      border-color: #66fcf1;
      box-shadow: 0 0 20px rgba(102, 252, 241, 0.4);
    }

    .epg-poster {
      position: relative;
      width: 100%;
      padding-bottom: 140%;
      background: #000;
      overflow: hidden;
    }

    .epg-live-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #66fcf1;
      color: #0b0c10;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      z-index: 1;
      pointer-events: none;
    }

    .epg-poster img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .epg-info {
      padding: 12px;
    }

    .epg-time {
      font-size: 0.75rem;
      color: #66fcf1;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .epg-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-height: 1.3;
    }

    .epg-category {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.6);
      margin-bottom: 5px;
    }

    .epg-duration {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.5);
    }

    .epg-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 5000;
      overflow-y: auto;
      padding: 20px;
    }

    .epg-modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .epg-modal-content {
      background: linear-gradient(145deg, #1f2833 0%, #2a3441 100%);
      border-radius: 16px;
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .epg-modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.5rem;
      line-height: 1;
      transition: all 0.3s;
      z-index: 1;
    }

    .epg-modal-close:hover {
      background: #66fcf1;
      color: #0b0c10;
    }

    .epg-modal-poster {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 16px 16px 0 0;
    }

    .epg-modal-body {
      padding: 20px;
    }

    .epg-modal-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #66fcf1;
      margin-bottom: 10px;
    }

    .epg-modal-meta {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 15px;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.7);
    }

    .epg-modal-meta span {
      background: rgba(102, 252, 241, 0.1);
      padding: 5px 10px;
      border-radius: 5px;
    }

    .epg-modal-description {
      color: rgba(255,255,255,0.9);
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .epg-modal-detail {
      margin-bottom: 12px;
      color: rgba(255,255,255,0.8);
      font-size: 0.9rem;
    }

    .epg-modal-detail strong {
      color: #66fcf1;
      display: block;
      margin-bottom: 5px;
    }

    body:not(.in-fullscreen) .player-wrapper {
      flex: 0 0 auto;
      height: 40vh;
      max-height: 40vh;
    }

    body:not(.in-fullscreen) .epg-section {
      display: flex;
	  flex: 1 1 auto; 
	  max-height: calc(60vh - 120px);
    }

    body.in-fullscreen .epg-section {
      display: none;
    }

    .epg-timeline::-webkit-scrollbar {
      height: 8px;
    }

    .epg-timeline::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.3);
      border-radius: 4px;
    }

    .epg-timeline::-webkit-scrollbar-thumb {
      background: #45a29e;
      border-radius: 4px;
    }

    .epg-timeline::-webkit-scrollbar-thumb:hover {
      background: #66fcf1;
    }

    @media (max-width: 768px) {
      header {
        padding: 10px 15px;
      }

      header h1 {
        font-size: 1rem;
      }

      header img {
        height: 35px;
        width: 35px;
      }

      header button {
        padding: 8px 12px;
        font-size: 0.85rem;
      }

      .epg-program {
        min-width: 160px;
        max-width: 160px;
      }

      .epg-modal-poster {
        height: 250px;
      }

      .epg-header h3 {
        font-size: 1rem;
      }

      .epg-date-dropdown {
        min-width: auto;
        font-size: 0.8rem;
        padding: 6px 10px;
      }
    }

    @media (max-width: 480px) {
      .epg-program {
        min-width: 140px;
        max-width: 140px;
      }
    }
  </style>
</head>
<body>
  <header id="header">
    <img id="logo" src="" alt="Channel Logo" />
    <h1 id="title">Loading...</h1>
<div style="position:relative;">
  <button class="header-audio-btn" id="headerAudioBtn">🎵 Audio</button>
  <div class="header-audio-dropdown" id="headerAudioDropdown"></div>
</div>
<button onclick="window.location.href='index.html'">← Back</button>
  </header>

  <div class="player-wrapper" id="playerWrapper">
    <video id="videoPlayer" playsinline preload="auto" crossorigin="anonymous" webkit-playsinline></video>
    <div class="error-message" id="error"></div>
  </div>

  <div class="epg-section" id="epgSection">
    <div class="epg-header">
      <h3>📺 Program Guide</h3>
      <div class="epg-date-controls">
        <select class="epg-date-dropdown" id="epgDateDropdown">
          <option value="0">Today</option>
        </select>
      </div>
    </div>
    <div class="epg-scroll-container">
      <button class="epg-scroll-btn left" id="scrollLeftBtn">‹</button>
      <div class="epg-timeline" id="epgTimeline">
        <div class="epg-loading">Loading programs...</div>
      </div>
      <button class="epg-scroll-btn right" id="scrollRightBtn">›</button>
    </div>
  </div>

  <footer id="controlsFooter"></footer>

<script>
    let hls;
    let dashPlayer;
    let player;
    let currentEPGOffset = 0;
    let currentChannelEPG = null;
    let lastTapTime = 0;

    const languageMap = {
      'tam': 'Tamil', 'ta': 'Tamil',
      'tel': 'Telugu', 'te': 'Telugu',
      'mal': 'Malayalam', 'ml': 'Malayalam',
      'kan': 'Kannada', 'kn': 'Kannada',
      'hin': 'Hindi', 'hi': 'Hindi',
      'ben': 'Bengali', 'bn': 'Bengali',
      'guj': 'Gujarati', 'gu': 'Gujarati',
      'ori': 'Odia', 'or': 'Odia',
      'mar': 'Marathi', 'mr': 'Marathi',
      'eng': 'English', 'en': 'English',
      'pan': 'Punjabi', 'pa': 'Punjabi',
      'und': 'Unknown'
    };

    function getLanguageName(code) {
      if (!code) return 'Unknown';
      const normalized = code.toLowerCase().substring(0, 3);
      const twoLetter = code.toLowerCase().substring(0, 2);
      return languageMap[normalized] || languageMap[twoLetter] || code || 'Unknown';
    }

    function showError(message) {
      const error = document.getElementById('error');
      const video = document.getElementById('videoPlayer');
      if (message) {
        video.style.display = 'none';
        error.textContent = message;
        error.style.display = 'block';
      } else {
        error.style.display = 'none';
      }
    }

    function setupEPGScrollButtons() {
      const scrollLeftBtn = document.getElementById('scrollLeftBtn');
      const scrollRightBtn = document.getElementById('scrollRightBtn');
      const epgTimeline = document.getElementById('epgTimeline');

      if (!scrollLeftBtn || !scrollRightBtn || !epgTimeline) return;

      scrollLeftBtn.addEventListener('click', () => {
        epgTimeline.scrollBy({ left: -300, behavior: 'smooth' });
      });

      scrollRightBtn.addEventListener('click', () => {
        epgTimeline.scrollBy({ left: 300, behavior: 'smooth' });
      });
    }

    function setupDateNavigation() {
      const dropdown = document.getElementById('epgDateDropdown');

      if (!dropdown) return;

      function populateDropdown() {
        dropdown.innerHTML = '';
        const today = new Date();

        for (let i = -7; i <= 6; i++) {
          const date = new Date(today);
          date.setDate(today.getDate() + i);

          const option = document.createElement('option');
          option.value = i;

          const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
          const monthDay = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

          if (i === 0) {
            option.textContent = `Today (${dayName}, ${monthDay})`;
          } else if (i === -1) {
            option.textContent = `Yesterday (${dayName}, ${monthDay})`;
          } else if (i === 1) {
            option.textContent = `Tomorrow (${dayName}, ${monthDay})`;
          } else if (i < 0) {
            option.textContent = `${Math.abs(i)} days ago (${dayName}, ${monthDay})`;
          } else {
            option.textContent = `In ${i} days (${dayName}, ${monthDay})`;
          }

          dropdown.appendChild(option);
        }

        dropdown.value = currentEPGOffset;
      }

      dropdown.addEventListener('change', async (e) => {
        const newOffset = parseInt(e.target.value);
        if (!isNaN(newOffset) && currentChannelEPG) {
          currentEPGOffset = newOffset;
          await loadEPG(currentChannelEPG, currentEPGOffset);
        }
      });

      populateDropdown();
    }

    async function loadEPG(epgUrl, offset = 0) {
      const epgTimeline = document.getElementById('epgTimeline');

      if (!currentChannelEPG) {
        currentChannelEPG = epgUrl;
      }

      epgTimeline.innerHTML = '<div class="epg-loading">Loading programs...</div>';

      try {
        let modifiedUrl = epgUrl;

        if (modifiedUrl.includes('offset=')) {
          modifiedUrl = modifiedUrl.replace(/offset=-?\d+/, `offset=${offset}`);
        } else {
          const separator = modifiedUrl.includes('?') ? '&' : '?';
          modifiedUrl += `${separator}offset=${offset}`;
        }

        const separator = modifiedUrl.includes('?') ? '&' : '?';
        const cacheBustedUrl = `${modifiedUrl}${separator}_t=${Date.now()}`;

        const response = await fetch(cacheBustedUrl, {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache' }
        });
        const data = await response.json();

        if (data.epg && data.epg.length > 0) {
          renderEPG(data.epg);

          const dropdown = document.getElementById('epgDateDropdown');
          if (dropdown) {
            dropdown.value = offset;
          }
        } else {
          epgTimeline.innerHTML = '<div class="epg-loading">No program data available</div>';
        }
      } catch (error) {
        console.error('Error loading EPG:', error);
        epgTimeline.innerHTML = '<div class="epg-loading">Failed to load program guide</div>';
      }
    }

    function renderEPG(programs) {
      const epgTimeline = document.getElementById('epgTimeline');
      const now = Date.now();

      epgTimeline.innerHTML = '';

      let currentIndex = programs.findIndex(program => {
        return now >= program.startEpoch && now <= program.endEpoch;
      });

      if (currentIndex === -1) {
        currentIndex = programs.findIndex(program => program.startEpoch > now);
      }

      if (currentIndex === -1) {
        currentIndex = 0;
      }

      programs.forEach((program, index) => {
        const startTime = program.startEpoch;
        const endTime = program.endEpoch;
        const isCurrent = now >= startTime && now <= endTime;

        const programCard = document.createElement('div');
        programCard.className = `epg-program ${isCurrent ? 'current' : ''}`;

        const posterUrl = program.episodePoster
          ? `https://jiotvimages.cdn.jio.com/dare_images/shows/${program.episodePoster}`
          : 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 140\'%3E%3Crect fill=\'%231f2833\' width=\'100\' height=\'140\'/%3E%3Ctext x=\'50\' y=\'70\' font-family=\'Arial\' font-size=\'30\' fill=\'%2366fcf1\' text-anchor=\'middle\' dominant-baseline=\'middle\'%3ETV%3C/text%3E%3C/svg%3E';

        programCard.innerHTML = `
          <div class="epg-poster">
            ${isCurrent ? '<div class="epg-live-badge">▶ LIVE NOW</div>' : ''}
            <img src="${posterUrl}" alt="${program.showname}" loading="lazy">
          </div>
          <div class="epg-info">
            <div class="epg-time">${program.showtime} - ${program.endtime}</div>
            <div class="epg-title">${program.showname}</div>
          </div>
        `;

        programCard.addEventListener('click', () => showEPGDetails(program));

        epgTimeline.appendChild(programCard);
      });

        }
      } catch (e) {
        console.log('screen.orientation.lock failed:', e);

      try {
        if (screen.lockOrientation) {

          console.log('Orientation locked via screen.lockOrientation');
          return true;
        }
      } catch (e) {
        console.log('screen.lockOrientation failed:', e);
      }

          console.log('Orientation locked via screen.mozLockOrientation');
          return true;
        }
      } catch (e) {
        console.log('screen.mozLockOrientation failed:', e);
      }

      try {

          console.log('Orientation locked via screen.msLockOrientation');

    async function toggleFullscreenWithOrientation() {

      if (!document.fullscreenElement && !document.webkitFullscreenElement && 
          !document.mozFullScreenElement && !document.msFullscreenElement) {
        try {
          if (video.requestFullscreen) {
            await video.requestFullscreen();
          } else if (video.webkitRequestFullscreen) {
            await video.webkitRequestFullscreen();
          } else if (video.webkitEnterFullscreen) {
            video.webkitEnterFullscreen();
          } else if (video.mozRequestFullScreen) {
            await video.mozRequestFullScreen();
          } else if (video.msRequestFullscreen) {
            await video.msRequestFullscreen();
          }

          setTimeout(async () => {
            await lockOrientation('landscape');
          }, 100);

        } catch (err) {
          console.error('Fullscreen request failed:', err);
        }
      } else {
        try {
          unlockOrientation();
          
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            await document.webkitExitFullscreen();
          } else if (document.mozCancelFullScreen) {
            await document.mozCancelFullScreen();
          } else if (document.msExitFullscreen) {
            await document.msExitFullscreen();
          }
        } catch (err) {

  console.error('HLS Error:', data.type, data.details, data);
  
  if (data.fatal) {
    switch(data.type) {
      case Hls.ErrorTypes.NETWORK_ERROR:
        errorRetryCount++;
        if (errorRetryCount <= MAX_RETRIES) {
          console.log(`Network error, retry ${errorRetryCount}/${MAX_RETRIES}...`);
          hls.startLoad();
        } else {
          console.log('Max retries reached, trying next stream link...');
          hls.destroy();
          currentLinkIndex++;
          tryNextStream();
        }
        break;
        
      case Hls.ErrorTypes.MEDIA_ERROR:
        errorRetryCount++;
        if (errorRetryCount <= MAX_RETRIES) {
          console.log(`Media error, retry ${errorRetryCount}/${MAX_RETRIES}...`);
          hls.recoverMediaError();
        } else {
          console.log('Max retries reached, trying next stream link...');
          hls.destroy();
          currentLinkIndex++;
          tryNextStream();
        }
        break;
        
      default:
        console.error('Unrecoverable error, trying next stream link...');
        hls.destroy();
        currentLinkIndex++;
        tryNextStream();
        break;
    }
  }

    document.addEventListener("DOMContentLoaded", initPlayer);
</script>
