<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Catchup Programs | Pangu Catchup</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <style>
    body {
      background: radial-gradient(circle at top, #1f2937 0, #020617 55%);
      color: #e5e7eb;
      min-height: 100vh;
    }
    .glass {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.25);
    }
    .gradient-text {
      background: linear-gradient(90deg, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card-hover {
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .card-hover:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.95);
      border-color: rgba(168, 85, 247, 0.7);
    }
    @media (max-width: 640px) {
      .logo-img {
        width: 64px !important;
        height: 64px !important;
      }
      .program-img {
        height: 140px !important;
      }
    }
  </style>
</head>
<body>
  <header class="border-b border-slate-800/70 bg-slate-950/80 backdrop-blur sticky top-0 z-20">
    <div class="max-w-5xl mx-auto px-3 py-2.5 flex items-center justify-between">
      <a href="catchupindex.html" class="text-xs text-slate-400 hover:text-slate-200 flex items-center gap-1.5">
        <span class="text-base">←</span>
        <span>Channels</span>
      </a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-3 py-4 md:py-6">
    <section id="headerCard" class="glass rounded-xl border border-slate-800 p-4 md:p-5 mb-4 md:mb-6 flex flex-col md:flex-row gap-4 items-center md:items-start">
      <img id="logo" src="" alt="" class="logo-img w-16 h-16 md:w-20 md:h-20 rounded-xl bg-slate-900 border border-slate-800 object-contain" />
      <div class="flex-1 w-full text-center md:text-left">
        <h1 id="name" class="text-lg md:text-xl font-bold gradient-text mb-1">Loading…</h1>
        <p id="meta" class="text-xs text-slate-400 mb-1"></p>
        <p id="date" class="text-sm text-slate-300"></p>
      </div>
    </section>

    <section>
      <div id="status" class="text-xs text-slate-400 mb-3 px-1">Loading programs…</div>
      <div id="programGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 md:gap-4"></div>
    </section>
  </main>

  <script>
    const WORKER_BASE = "https://catchup.porus-in2012.workers.dev";

    function getQueryParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function extractHexFromWorkerUrl(url, type) {
      if (!url) return null;
      const m = url.match(new RegExp("/" + type + "/([^/?#]+)"));
      return m ? m[1] : null;
    }
	
async function decryptWorkerResponse(encryptedB64) {
  const ENCRYPTION_KEY = "PUSHPA1210SUBBU1501PURUSHOTH1005"; // SAME KEY as worker
  
  try {
    // Decode base64
    const combined = Uint8Array.from(atob(encryptedB64), c => c.charCodeAt(0));
    
    // Extract IV and encrypted data
    const iv = combined.slice(0, 12);
    const encrypted = combined.slice(12);
    
    // Import key
    const key = await crypto.subtle.importKey(
      "raw",
      new TextEncoder().encode(ENCRYPTION_KEY),
      { name: "AES-GCM" },
      false,
      ["decrypt"]
    );
    
    // Decrypt
    const decrypted = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: iv },
      key,
      encrypted
    );
    
    const plaintext = new TextDecoder().decode(decrypted);
    return JSON.parse(plaintext);
  } catch (err) {
    throw new Error("Decryption failed: " + err.message);
  }
}	

    async function loadCatchup() {
      const hex = getQueryParam("hex");
      const statusEl = document.getElementById("status");
      const programGrid = document.getElementById("programGrid");

      if (!hex) {
        statusEl.textContent = "Missing hex parameter";
        statusEl.classList.add("text-red-400");
        return;
      }

      try {
        const res = await fetch(`${WORKER_BASE}/cp/${hex}/`);
		if (!res.ok) throw new Error("HTTP " + res.status);
		const encryptedResponse = await res.json();
		const data = await decryptWorkerResponse(encryptedResponse.encrypted);

        document.getElementById("logo").src = data.logo || "";
        document.getElementById("logo").alt = data.name || "";
        document.getElementById("name").textContent = data.name || "Unknown Channel";
        document.getElementById("meta").textContent = data.category
          ? `${data.category}`
          : "";
        document.getElementById("date").textContent = data.date
          ? `${data.date}`
          : "";

        const programs = Array.isArray(data.programs) ? data.programs : [];
        if (programs.length === 0) {
          statusEl.textContent = "No programs found for this date";
          return;
        }

        statusEl.textContent = `${programs.length} program${programs.length !== 1 ? 's' : ''}`;

        programs.forEach((p) => {
          const cplayHex = extractHexFromWorkerUrl(p.cplay_url, "cplay");
          const card = document.createElement("div");
          card.className = "glass card-hover rounded-xl border border-slate-800 p-3 flex flex-col";
          card.innerHTML = `
            <img
              src="${p.image || ""}"
              alt="${p.title || ""}"
              class="program-img w-full h-36 object-cover rounded-lg mb-2.5 bg-slate-900"
              loading="lazy"
            />
            <div class="flex-1 flex flex-col">
              <h3 class="text-sm font-semibold text-slate-100 mb-1 line-clamp-2">
                ${p.title || "Untitled"}
              </h3>
              <p class="text-[10px] text-slate-400 mb-2">
                ${p.date || data.date || ""} · ${p.time || ""}
              </p>
              <p class="text-xs text-slate-300 mb-2.5 line-clamp-3">
                ${p.description || ""}
              </p>
              ${
                cplayHex
                  ? `<a
                       href="cplayer.html?mode=cplay&hex=${encodeURIComponent(cplayHex)}"
                       class="mt-auto inline-flex justify-center items-center text-[11px] font-medium px-3 py-1.5 rounded-full
                              bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white"
                     >
                       ▶ Watch
                     </a>`
                  : `<span class="text-[11px] text-red-400 mt-auto text-center">Invalid link</span>`
              }
            </div>
          `;
          programGrid.appendChild(card);
        });
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Failed to load catchup programs";
        statusEl.classList.add("text-red-400");
      }
    }

    loadCatchup();
  </script>
</body>
</html>
